spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

supabase:
  url: ${SUPABASE_URL}                    # https://xxxx.supabase.co

server:
  port: ${PORT:8080}