#
# Perfil de test. Dos reglas:
#  1. Nunca se copia un secreto real de Neon ni de Supabase acá.
#     Los valores son obviamente falsos a propósito.
#  2. No se declara datasource: los tests de seguridad no tocan la base.

# HS256 exige clave de al menos 32 bytes, por eso el largo.
# Base64 de "fake-secret-solo-para-tests-nunca-en-produccion-000" (51 bytes).

# application-test.yml
spring:
    flyway:
        enabled: false
    jpa:
        hibernate:
            ddl-auto: create-drop
# ConfigAdmin exige ADMIN_EMAIL (sin default) y decide con PASS_ADMIN.
# En test: email dummy + PASS_ADMIN vacio -> el runner retorna sin insertar nada.
ADMIN_EMAIL: admin@test.local
PASS_ADMIN: ""
# SupabaseTokenVerifier inyecta ${SUPABASE_URL} (mayusculas), NO ${supabase.url}:
# @Value no hace relaxed binding. Sin esta property el contexto no arranca.
SUPABASE_URL: https://proyecto-inexistente.supabase.co
jwt:
    secret: ZmFrZS1zZWNyZXQtc29sby1wYXJhLXRlc3RzLW51bmNhLWVuLXByb2R1Y2Npb24tMDAw
    expiration: 3600000

supabase:
    url: https://proyecto-inexistente.supabase.co

logging:
    level:
        root: WARN
        com.nahuel.ecommerce: INFO
        org.springframework.security: WARN

MERCADOPAGO_WEBHOOK_SECRET: secreto-falso-solo-tests
MERCADOPAGO_ACCESS_TOKEN: token-falso-solo-tests
MERCADOPAGO_API_URL: https://mercadopago.test.invalid
MERCADOPAGO_NOTIFICATION_URL: https://backend.test.invalid/api/webhooks/mercadopago